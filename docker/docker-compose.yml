services:
  kafka-analytics:
    image: apache/kafka:latest
    container_name: kafka-analytics
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka-analytics:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka-analytics:
        condition: service_started
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-test-topic}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-analytics:9093 --list >/dev/null 2>&1; do
          echo "Waiting for Kafka..."
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-analytics:9093 \
          --create \
          --if-not-exists \
          --topic "$$KAFKA_TOPIC" \
          --partitions 1 \
          --replication-factor 1
        echo "Topic $$KAFKA_TOPIC is ready"
    restart: "no"

  message-producer:
    container_name: message-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka-analytics:
        condition: service_started
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:ro
    command: ["tweet_producer"]
    restart: no

  postgres:
    image: postgres:latest
    container_name: postgres-analytics
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  message-consumer:
    container_name: message-consumer
    depends_on:
      message-producer:
        condition: service_started
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:ro
    command: [ "tweet_consumer" ]
    restart: no


volumes:
  kafka_data:
  postgres_data: