services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-analytics
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka-analytics:
        condition: service_started
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-my-app-events}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-analytics:9092 --list >/dev/null 2>&1; do
          echo "Waiting for Kafka..."
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-analytics:9092 \
          --create \
          --if-not-exists \
          --topic "$$KAFKA_TOPIC" \
          --partitions 1 \
          --replication-factor 1
        echo "Topic $$KAFKA_TOPIC is ready"
    restart: "no"


volumes:
  kafka_data: