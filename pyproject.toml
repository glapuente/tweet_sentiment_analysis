[project]
name = "tweet-sentiment-analysis"
version = "1.0.0"
description = "Simple self-contained project for sentiment analysis on social media messages"
authors = [
    {name = "glapuente",email = "glapuentevalea@gmail.com"}
]
requires-python = "==3.12.0"
dependencies = [
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "faker>=40.43.0",
    "python-dotenv>=1.2.4",
    "confluent-kafka>=2.16.1",
    "pyspark>=4.3.0",
    "vadersentiment>=3.3.2",
]

[[tool.mypy.overrides]]
module = ["vaderSentiment.*"]
ignore_missing_imports = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "*", from = "src" }
]

[project.scripts]
tweet_producer = "tweet_producer.entry_point.produce_tweets:tweet_producer"
tweet_consumer = "tweet_producer.entry_point.consume_tweets:tweet_consumer"
